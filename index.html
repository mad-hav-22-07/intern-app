<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050806" media="(prefers-color-scheme: dark)" />
    <title>Internship Preparation Drive</title>
    <script>
      // Apply the stored theme before first paint. Light is the default.
      try {
        if (JSON.parse(localStorage.getItem('ipd.theme.v1')) === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
